# Trenutno imamo samo postavljene mikroservise
# Applikacija treba da
# Inicijalizuje transaction process
# 
#
name: money-transition-state-machine

possible-states:
  - INITIALIZED

steps:
  - step_name: "INIT"
    service: ""
    description: "Initialize the payment process"
    data_required:
      - user_id
      - payment_method
    transitions:
      success: "VALIDATE_PAYMENT"
      failure: "FAILED"
      timeout: "TIMED_OUT"
    timeout: 30s
    retries: 3
